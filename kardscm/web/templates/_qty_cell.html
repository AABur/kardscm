{% if edit_mode %}
<td class="qty-cell" hx-on:click="event.stopPropagation()">
  <input
    type="number"
    name="quantity"
    min="0"
    max="{{ rarity_max_quantity.get(card.rarity_raw, 4) }}"
    value="{{ card.quantity }}"
    hx-post="/cards/{{ card.cardId }}/quantity"
    hx-trigger="change"
    hx-target="closest td"
    hx-swap="outerHTML settle:600ms"
  >
</td>
{% else %}
<td class="num">{{ card.quantity }}</td>
{% endif %}
