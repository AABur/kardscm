# Manually-curated extra abilities — visible only in the game client UI,
# not present in the GraphQL API. Edit this file and re-launch
# `kardscm web` (or `kardscm sync`) to apply: changes are detected via
# file hash and re-applied automatically.
#
# Each section is `[abilities.<key>]` where `<key>` must appear in
# KNOWN_EXTRA_ABILITIES (kardscm/constants.py). The `cards` array lists
# cardId values that have this ability.
#
# Source: GraphQL `q=<russian-stem>` search via
# scripts/discover_extra_abilities.py — Russian stems match what the
# in-game deck-builder URL returns and serve as the source of truth.

