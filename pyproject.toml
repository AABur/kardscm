[build-system]
requires = ["setuptools>=45"]
build-backend = "setuptools.build_meta"

[project]
name = "kardscm"
version = "0.2.0"
description = "KARDS Manager for player collection and decks with multi-format export"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Alexander Burchenko", email = "aabur@mail.ru" }
]
keywords = ["kards", "card-game", "collection", "deck", "scraper"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "playwright>=1.40.0",
    "openpyxl>=3.1.0",
    "httpx>=0.27.0",
    "typer>=0.9.0",
]

[project.urls]
Repository = "https://github.com/AABur/kardscm"
Issues = "https://github.com/AABur/kardscm/issues"

[project.scripts]
kardscm = "kardscm.cli:run"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
]

[tool.setuptools]
packages = ["kardscm"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["kardscm"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --cov=kardscm --cov-report=term-missing"
